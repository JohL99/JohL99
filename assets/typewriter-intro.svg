<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Typewriter Intro">
  <defs>
    <linearGradient id="ti-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122638"/> <!-- Set 0 transparency -->
      <stop offset="1" stop-color="#081020"/> <!-- Set 0 transparency -->
    </linearGradient>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="18" ry="18" fill="url(#ti-stage)"/>

  <!-- Terminal window -->
  <g filter="url(#ti-shadow)">
    <rect x="80" y="40" width="1040" height="350" rx="14" fill="#11131c"/>
    <!-- Title bar -->
    <rect x="80" y="40" width="1040" height="38" rx="14" fill="#1c1f2e"/>
    <rect x="80" y="60" width="1040" height="18" fill="#1c1f2e"/>
    <line x1="80" y1="78" x2="1120" y2="78" stroke="#0a0c14" stroke-width="0.6"/>
  </g>

  <!-- Traffic lights -->
  <circle cx="106" cy="59" r="6.5" fill="#ff5f56"/>
  <circle cx="128" cy="59" r="6.5" fill="#ffbd2e"/>
  <circle cx="150" cy="59" r="6.5" fill="#27c93f"/>

  <!-- Window title -->
  <text x="600" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#7a7f99" letter-spacing="2">~/john — zsh — 124×34</text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18">
    <!-- Prompt 1 -->
    <text x="110" y="112" fill="#a78bfa">john@zsh</text>
    <text x="190" y="112" fill="#7a7f99">:</text>
    <text x="200" y="112" fill="#7ee787">~</text>
    <text x="210" y="112" fill="#7a7f99">$</text>
    <text x="235" y="112" fill="#c9d1d9">whoami</text>
    <text x="110" y="138" fill="#c9d1d9">→ John Lamprecht · Full-Stack &amp; Systems-Curious Engineer · Nanaimo, BC</text>
    <text x="110" y="158" fill="#7a7f99">Next.js · TypeScript · Python · PostgreSQL · Redis · Docker · AWS</text>

    <!-- Prompt 2 -->
    <text x="110" y="185" fill="#a78bfa">john@zsh</text>
    <text x="190" y="185" fill="#7a7f99">:</text>
    <text x="200" y="185" fill="#7ee787">~</text>
    <text x="210" y="185" fill="#7a7f99">$</text>
    <text x="235" y="185" fill="#c9d1d9">cat now.md</text>
    <text x="110" y="208" fill="#fcd34d">## Currently</text>
    <text x="110" y="226" fill="#c9d1d9">- Leading platform architecture @ Consensus Metals</text><text x="615" y="226" fill="#7a7f99"> (Next.js · Redis · PostgreSQL · AWS)</text>
    <text x="110" y="246" fill="#c9d1d9">- Automating high-volume PDF quote &amp; email pipelines</text><text x="635" y="246" fill="#7a7f99"> (Python · Flask · Batch)</text>
    <text x="110" y="266" fill="#c9d1d9">- Building secure brokered file-transfer systems</text><text x="600" y="266" fill="#7a7f99"> (VPN · zero-trust · layered encryption)</text>
 

    <!-- Prompt 3 -->
    <text x="110" y="293" fill="#a78bfa">john@zsh</text>
    <text x="190" y="293" fill="#7a7f99">:</text>
    <text x="200" y="293" fill="#7ee787">~</text>
    <text x="210" y="293" fill="#7a7f99">$</text>
    <text x="235" y="293" fill="#c9d1d9">contact --all</text>
    <text x="110" y="316" fill="#58a6ff">→ JohnLamprecht.com</text>
    <text x="325" y="316" fill="#58a6ff">@JohL99</text>
    <text x="415" y="316" fill="#58a6ff">in/JohnLamprecht</text>

    <!-- Final prompt with cursor -->
    <text x="110" y="345" fill="#a78bfa">john@zsh</text>
    <text x="190" y="345" fill="#7a7f99">:</text>
    <text x="200" y="345" fill="#7ee787">~</text>
    <text x="210" y="345" fill="#7a7f99">$</text>
    <rect x="235" y="330" width="9" height="14" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status strip, flush with bottom of terminal -->
  <rect x="80" y="368" width="1040" height="22" rx="14" fill="#171a26"/>
  <rect x="80" y="368" width="1040" height="12" fill="#171a26"/>
  <line x1="80" y1="368" x2="1120" y2="368" stroke="#0a0c14" stroke-width="0.6"/>
  <g transform="translate(80,383)" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5a5f7a">
    <text x="30" y="0">UTF-8</text>
    <text x="96" y="0">zsh</text>
    <text x="156" y="0">ctrl-l · clear</text>
    <text x="1010" y="0" text-anchor="end" fill="#7ee787">● connected</text>
  </g>
</svg>
